spring.application.name=SilverPear

# false: не удалять пользователей при старте (регистрации сохраняются). true: полный сброс демо-данных каждый запуск.
app.data.reset-on-startup=false

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method


logging.file.path=logs

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/silver_pear?createDatabaseIfNotExist=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
spring.jpa.properties.hibernate.use_sql_comments=true
#logging.level.org.hibernate.SQL=DEBUG
spring.jpa.show-sql=false

app.jwt.secret=${JWT_SECRET:SilverPearDevSecretKeyMustBe256BitsLongSecretKeyForHS256!!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
