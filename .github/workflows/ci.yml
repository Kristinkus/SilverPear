# CI/CD — четыре этапа (как в задании):
# 1) Сборка      — Vite + JAR (без выполнения тестов)
# 2) Тесты       — Surefire по артефакту target/
# 3) Развёртывание — образ Docker и push в GHCR (на push в main/master)
# 4) Healthcheck — Compose + /actuator/health на раннере; если задан PUBLIC_APP_URL — проверка прода
#
# SonarCloud: Variables → RUN_SONAR = true и секрет SONAR_TOKEN

name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "22"

jobs:
  build:
    name: Сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend (Vite)
        working-directory: frontend
        run: npm ci && npm run build

      - name: Backend (JAR, тесты не запускаются)
        run: mvn -B -Pcheckstyle-skip clean package -DskipTests

      - uses: actions/upload-artifact@v4
        with:
          name: maven-target
          path: target/
          retention-days: 2

  test:
    name: Тесты
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - uses: actions/download-artifact@v4
        with:
          name: maven-target
          path: target/

      - name: Запуск unit-тестов
        run: mvn -B -Pcheckstyle-skip surefire:test

      - name: SonarCloud (включите переменной RUN_SONAR)
        if: vars.RUN_SONAR == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B -Pcheckstyle-skip sonar:sonar

  deploy:
    name: Развёртывание
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Имя образа для GHCR (нижний регистр)
        id: ghcr
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Вход в GitHub Container Registry
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Метаданные образа
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ghcr.outputs.image }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable=${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}

      - name: Docker build / push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  healthcheck:
    name: Healthcheck
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: .env для Compose
        run: |
          printf '%s\n' \
            'DB_USERNAME=root' \
            'DB_PASSWORD=ci_silverpear_mysql' \
            'JWT_SECRET=CiJwtSecretMustBeLongEnoughForHS256AlgorithmTestOnly!!' \
            > .env

      - name: Docker Compose — подъём и /actuator/health
        run: docker compose up -d --build

      - name: Ожидание health (локальный стек)
        run: |
          set -e
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:8080/actuator/health; then
              echo "Compose health OK"
              exit 0
            fi
            echo "Попытка $i/50..."
            sleep 6
          done
          echo "Таймаут Compose health"
          docker compose ps
          docker compose logs --no-color --tail=120 app || true
          exit 1

      - name: Остановка Compose
        if: always()
        run: docker compose down -v --remove-orphans

      - name: Прод — GET /actuator/health
        if: ${{ vars.PUBLIC_APP_URL != '' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
        run: curl -fsS "${{ vars.PUBLIC_APP_URL }}/actuator/health"
