# CI/CD (учебный конвейер)
# 1) build-test   — сборка фронта (Vite) + Maven verify (компиляция, unit-тесты, JAR)
# 2) docker-publish — после успешных тестов: сборка образа и push в GHCR (артефакт «развёртывания»)
# 3) stack-smoke   — подъём app+MySQL через Docker Compose на раннере и GET /actuator/health (healthcheck без хостинга)
# 4) healthcheck-remote — опционально: проверка уже выставленного в интернет приложения (Settings → Variables → PUBLIC_APP_URL)
#
# SonarCloud: по умолчанию шаг выключен. Включите в Settings → Variables → Actions: RUN_SONAR = true
# и задайте секрет SONAR_TOKEN (иначе шаг упадёт).

name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "22"

jobs:
  build-test:
    name: Сборка и тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend — install и build
        working-directory: frontend
        run: npm ci && npm run build

      - name: Maven — verify (тесты и пакет)
        run: mvn -B -Pcheckstyle-skip clean verify

      # В if: нельзя использовать secrets — только vars / github / env (иначе Invalid workflow file).
      - name: SonarCloud (включите переменной RUN_SONAR)
        if: vars.RUN_SONAR == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B -Pcheckstyle-skip sonar:sonar

  docker-publish:
    name: Образ в GHCR (деплой-артефакт)
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Имя образа для GHCR (только нижний регистр)
        id: ghcr
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Вход в GitHub Container Registry
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Метаданные образа
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ghcr.outputs.image }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable=${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}

      - name: Docker build / push (push только main/master)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  stack-smoke:
    name: Healthcheck (Compose на раннере)
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: .env для CI
        run: |
          printf '%s\n' \
            'DB_USERNAME=root' \
            'DB_PASSWORD=ci_silverpear_mysql' \
            'JWT_SECRET=CiJwtSecretMustBeLongEnoughForHS256AlgorithmTestOnly!!' \
            > .env

      - name: Docker Compose up (--build)
        run: docker compose up -d --build

      - name: Ожидание /actuator/health
        run: |
          set -e
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:8080/actuator/health; then
              echo "Health OK"
              exit 0
            fi
            echo "Попытка $i/50, ждём..."
            sleep 6
          done
          echo "Таймаут ожидания health"
          docker compose ps
          docker compose logs --no-color --tail=120 app || true
          exit 1

      - name: Остановка стека
        if: always()
        run: docker compose down -v --remove-orphans

  healthcheck-remote:
    name: Healthcheck (прод-URL)
    needs: docker-publish
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && vars.PUBLIC_APP_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: GET /actuator/health на PUBLIC_APP_URL
        run: curl -fsS "${{ vars.PUBLIC_APP_URL }}/actuator/health"
